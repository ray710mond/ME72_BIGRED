# Shared parameters for launch_all
# Add tunable parameters for packages here.

rf_driver:
  driver_type: pwm  # 'pwm' or 'ibus'
  chip_name: gpiochip4

autonomous_planner:
  ros__parameters:
    publish_hz: 20.0
    loop: false
    segments:
      # [vx, vy, wz, t] repeated
      - 0.1
      - 0.00
      - 0.00
      - 1.0

twist_mux:
  ros__parameters:
    output_topic: /cmd_vel_des
    topics:
      - name: autonomous
        topic: /cmd_vel_auto
        timeout: 0.5
        priority: 50

      - name: teleop
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100